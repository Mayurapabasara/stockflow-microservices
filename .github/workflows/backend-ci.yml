name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "services/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - "services/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - infrastructure/api-gateway
          - infrastructure/config-server
          - infrastructure/discovery-service
          - services/auth-service
          - services/inventory-service
          - services/notification-service
          - services/product-service
          - services/purchase-service
          - services/reporting-service
          - services/sales-service
          - services/supplier-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Verify module
        run: mvn --batch-mode --no-transfer-progress --file "${{ matrix.module }}/pom.xml" verify

