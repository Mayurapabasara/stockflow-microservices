server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://${PRODUCT_DB_HOST:localhost}:${PRODUCT_DB_PORT:3306}/${PRODUCT_DB_NAME:stockflow_product}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PRODUCT_DB_USER}
    password: ${PRODUCT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
