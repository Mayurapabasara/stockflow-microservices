spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:purchase;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
eureka:
  client:
    enabled: false
stockflow:
  kafka:
    enabled: false
  product:
    validation-enabled: false
  supplier:
    validation-enabled: false
