spring:
  application:
    name: inventory-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockflow_inventory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: ${SERVER_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

stockflow:
  product:
    validation-enabled: ${PRODUCT_VALIDATION_ENABLED:false}
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      stock-updated: ${STOCK_UPDATED_TOPIC:inventory.stock.updated}
      low-stock: ${LOW_STOCK_TOPIC:inventory.low-stock}
      product-created: ${PRODUCT_CREATED_TOPIC:product.created}
      product-updated: ${PRODUCT_UPDATED_TOPIC:product.updated}
      purchase-received: ${PURCHASE_RECEIVED_TOPIC:purchase.received}
      sale-fulfilled: ${SALE_FULFILLED_TOPIC:sale.fulfilled}
    groups:
      product-events: ${PRODUCT_EVENTS_GROUP:inventory-product-events}
      purchase-events: ${PURCHASE_EVENTS_GROUP:inventory-purchase-events}
      sales-events: ${SALES_EVENTS_GROUP:inventory-sales-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

