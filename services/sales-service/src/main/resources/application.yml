spring:
  application:
    name: sales-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sales_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
server:
  port: ${SERVER_PORT:8086}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
stockflow:
  product:
    validation-enabled: ${PRODUCT_VALIDATION_ENABLED:false}
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  inventory:
    validation-enabled: ${INVENTORY_VALIDATION_ENABLED:false}
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      sale-completed: ${SALE_COMPLETED_TOPIC:sale.fulfilled}
      sale-cancelled: ${SALE_CANCELLED_TOPIC:sale.cancelled}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
