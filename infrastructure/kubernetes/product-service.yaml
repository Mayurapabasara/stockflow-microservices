apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: stockflow/product-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: PRODUCT_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: stockflow-config
                  key: product-db-url
            - name: PRODUCT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: stockflow-secrets
                  key: product-db-user
            - name: PRODUCT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stockflow-secrets
                  key: product-db-password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
    - port: 8082
      targetPort: 8082
